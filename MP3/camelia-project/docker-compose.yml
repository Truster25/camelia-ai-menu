services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: camellia
      POSTGRES_USER: camellia
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camellia -d camellia"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
